<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrackLab // 8. Confirm</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Titillium+Web:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/styles.css">
</head>
<body class="min-h-screen flex flex-col">
  <nav class="dev-nav">
    <span class="dev-nav-label">Screen Switcher:</span>
    <button data-target="1" class="nav-btn">1. Login</button>
    <button data-target="2" class="nav-btn">2. Intro</button>
    <button data-target="3" class="nav-btn">3. Track Select</button>
    <button data-target="4" class="nav-btn">4. Tire Lesson</button>
    <button data-target="5" class="nav-btn">5. Pick Tires</button>
    <button data-target="6" class="nav-btn">6. Pit Lesson</button>
    <button data-target="7" class="nav-btn">7. Pick Pit Lap</button>
    <button data-target="8" class="nav-btn nav-btn-active">8. Confirm</button>
    <button data-target="9" class="nav-btn">9. Race Sim</button>
    <button data-target="10" class="nav-btn">10. Results</button>
    <button data-target="11" class="nav-btn">11. Dashboard</button>
  </nav>

  <header class="app-header">
    <div class="flex items-center gap-4">
      <div class="f1-badge">F1</div>
      <span class="header-title">TrackLab // Strategy Telemetry</span>
    </div>
    <div class="flex items-center gap-4 text-sm">
      <button data-goto="2" class="header-link">Replay Tutorial</button>
      <span class="divider">|</span>
      <button data-goto="11" class="header-link">Dashboard</button>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center p-8">
    <section id="screen-8" class="screen w-full max-w-xl panel f1-border-top p-8">
      <div class="section-tag">Part 3 // Pre-Race Confirmation</div>
      <h2 class="text-2xl font-bold uppercase mb-6">Here Is Your Final Race Strategy</h2>

      <div class="sub-box p-6 space-y-4 mono text-sm mb-6">
        <div class="summary-row">
          <span class="muted-text">CIRCUIT:</span>
          <span id="summary-track" class="font-bold">MELBOURNE (58 LAPS)</span>
        </div>
        <div class="summary-row">
          <span class="muted-text">STINT 01:</span>
          <span id="summary-s1" class="font-bold">SOFT (LAPS 1 – 18)</span>
        </div>
        <div class="summary-row">
          <span class="muted-text">PIT STOP WINDOW:</span>
          <span id="summary-pit" class="font-bold text-[#E10600]">END OF LAP 18 (+21.2s PIT LOSS)</span>
        </div>
        <div class="flex justify-between">
          <span class="muted-text">STINT 02:</span>
          <span id="summary-s2" class="font-bold">HARD (LAPS 19 – 58)</span>
        </div>
      </div>

      <div class="flex justify-between">
        <button data-goto="7" class="btn-outline">&larr; Edit Strategy</button>
        <button id="start-race-btn" class="btn-primary">Confirm &amp; Race Agent &rarr;</button>
      </div>
    </section>
  </main>

  <script src="../../assets/js/shared-state.js"></script>
</body>
</html>
