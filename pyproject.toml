[project]
name = "racecar"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "gymnasium",
    "stable-baselines3",
    "tensorboard",
    "matplotlib",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]